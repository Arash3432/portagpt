<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>ساخت کلیدهای امن Portal AI</title>
  <style>
    :root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#090b14;color:#f7f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#382066 0,transparent 35%),radial-gradient(circle at 10% 90%,#123c76 0,transparent 35%),#090b14}.card{width:min(760px,100%);padding:28px;border:1px solid #ffffff25;border-radius:28px;background:#111522d9;box-shadow:0 24px 80px #0008;backdrop-filter:blur(20px)}h1{margin:0 0 10px;font-size:clamp(24px,5vw,38px)}p{color:#bdc3d9;line-height:1.9}.warning{padding:14px 16px;border-radius:16px;background:#ff31551a;border:1px solid #ff5f7a55;color:#ffd7df}.row{margin-top:18px}label{display:block;margin-bottom:8px;color:#dfe3f2;font-weight:700}.value{display:flex;gap:8px}.value input{min-width:0;flex:1;padding:13px;border:1px solid #ffffff22;border-radius:12px;background:#080b13;color:#c8d8ff;font-family:Consolas,monospace;direction:ltr}.value button,.generate{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;color:white;background:#38405c}.generate{width:100%;margin-top:22px;padding:15px;font-size:17px;font-weight:800;background:linear-gradient(90deg,#246cff,#7c3cff,#ed315b)}.status{min-height:28px;margin-top:12px;color:#8de4b0;text-align:center;font-weight:700}@media(max-width:560px){.card{padding:20px;border-radius:20px}.value{flex-direction:column}}
  </style>
</head>
<body>
  <main class="card">
    <h1>کلیدهای امن Portal AI</h1>
    <p>این فایل بدون اینترنت و فقط روی دستگاه شما سه رمز تصادفی می‌سازد. هر مقدار را روبه‌روی نام یکسان در متغیرهای برنامه Liara قرار دهید.</p>
    <p class="warning">این مقادیر را برای هیچ‌کس، حتی پشتیبانی، نفرستید؛ در چت وارد نکنید و از صفحه عکس نگیرید.</p>
    <div id="fields"></div>
    <button class="generate" id="generate" type="button">ساخت سه کلید جدید</button>
    <div class="status" id="status" role="status"></div>
  </main>
  <script>
    const specs=[['SESSION_PEPPER',48],['OTP_PEPPER',48],['CONFIG_ENCRYPTION_KEY',32]];
    const fields=document.getElementById('fields');
    const status=document.getElementById('status');
    function randomBase64(length){const bytes=new Uint8Array(length);crypto.getRandomValues(bytes);let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary)}
    function render(){fields.replaceChildren(...specs.map(([name])=>{const row=document.createElement('div');row.className='row';const label=document.createElement('label');label.textContent=name;const wrap=document.createElement('div');wrap.className='value';const input=document.createElement('input');input.id=name;input.readOnly=true;input.setAttribute('aria-label',name);const copy=document.createElement('button');copy.type='button';copy.textContent='کپی';copy.addEventListener('click',async()=>{if(!input.value)return;try{await navigator.clipboard.writeText(input.value)}catch{input.select();document.execCommand('copy')}status.textContent=`${name} کپی شد`});wrap.append(input,copy);row.append(label,wrap);return row}))}
    function generate(){for(const [name,length] of specs)document.getElementById(name).value=randomBase64(length);status.textContent='سه کلید امن ساخته شد؛ آن‌ها را مستقیماً در Liara ثبت کنید.'}
    render();document.getElementById('generate').addEventListener('click',generate);
  </script>
</body>
</html>
